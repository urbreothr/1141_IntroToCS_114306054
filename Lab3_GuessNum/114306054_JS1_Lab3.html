<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>114306054_JS1_Lab3</title>
</head>
<body>
	<h1>114306054_Number Guessing Game</h1>
	<div id="resultArea"></div>
	<script>
		var answer = Math.floor(Math.random() * 100) + 1;
		var chances = 7;
		var low = 1;
		var high = 100;

		while (chances > 0) {
			var input = window.prompt("請輸入" + low + " 到 " + high +  " 之間的整數，\n你還有 " + chances +" 次機會。");

			input = input.trim();

			if (input === "" || isNaN(input)) {
				alert("請輸入有效數字！")
				continue;
			}

			var guess = Number(input);

			if (guess < 1 || guess > 100) {
				alert('請輸入有效範圍內的數字（不能超出 1 到 100）！');
				continue;
			}

			if (guess === answer) {
				alert('恭喜你答對了！正確答案是 ' + answer);
				document.getElementById("resultArea").innerHTML = '<img src="correct.jpg">';

				break;
			} else if (guess < answer) {
				low = guess;
			} else {
				high = guess;
			}

			chances--;
		}

		if (chances === 0) {
			alert("機會用完了。正確答案是 " + answer + "！");
			document.getElementById("resultArea").innerHTML = '<img src="wrong.jpg">';
		}

	</script>

</body>
</html>
